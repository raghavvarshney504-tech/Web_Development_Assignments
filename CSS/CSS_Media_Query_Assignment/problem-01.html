<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Grid Layout</title>
    
</head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container {
    width: 90%;
    margin: 20px auto;

    display: grid;
    gap: 20px;

    grid-template-columns: repeat(4, 1fr);

    grid-template-areas:
        "nav nav nav nav"
        "box1 box2 box3 box4";
}
.navigation {
    grid-area: nav;
    background-color: yellow;
    padding: 10px;
    font-size: 35px;
}

.box {
    height: 170px;
    padding: 10px;
    font-size: 18px;
}

/* Individual boxes */
.box1 {
    grid-area: box1;
    background-color: red;
}

.box2 {
    grid-area: box2;
    background-color: lime;
}

.box3 {
    grid-area: box3;
    background-color: #5865e8;
}

.box4 {
    grid-area: box4;
    background-color: #999;
}



@media screen and (max-width: 900px) {

    .container {
        grid-template-columns: repeat(2, 1fr);

        grid-template-areas:
            "nav nav"
            "box1 box3"
            "box2 box4";
    }

    .box {
        height: 330px;
        font-size: 30px;
    }

    .navigation {
        font-size: 45px;
    }
}



   

@media screen and (max-width: 600px) {

    .container {
        grid-template-columns: 1fr;

        grid-template-areas:
            "nav"
            "box1"
            "box4"
            "box2"
            "box3";
    }

    .box {
        height: 210px;
        font-size: 30px;
    }

    .navigation {
        font-size: 45px;
    }
}
</style>
<body>

    <div class="container">

        <div class="navigation">
            Navigation
        </div>

        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
        <div class="box box4">Box 4</div>

    </div>

</body>
</html>
