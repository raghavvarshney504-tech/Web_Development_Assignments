<!DOCTYPE html>

    <title>Hiring Partners</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #e8f5ff;
        }

        h1 {
            margin: 35px;
            font-size: 30px;
            font-weight: normal;
        }

        .main {
            width: 90%;
            margin: auto;
            background-color: #fff4e6;
            padding: 35px;
            box-sizing: border-box;
        }

        .heading {
            text-align: center;
        }

        .heading p {
            margin: 5px;
            font-weight: bold;
            color: #555;
        }

        .heading h2 {
            margin: 5px;
            font-size: 25px;
        }

        .companies {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 22px;
            margin-top: 30px;
        }

        .company {
            height: 65px;
            background-color: white;
            border-radius: 12px;

            display: flex;
            justify-content: center;
            align-items: center;

            box-shadow: 0px 2px 8px lightgrey;
        }

        .company img {
            width: 80px;
            height: 35px;
            object-fit: contain;
        }

        .button {
            display: flex;
            justify-content: center;
            margin-top: 35px;
        }

        .button div {
            border: 1px solid #ff4d6d;
            padding: 10px 18px;
            color: #ff4d6d;
            font-size: 12px;
            border-radius: 4px;
        }

    </style>
</head>
