<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard</title>

    <style>

        body {
            margin: 0;
            background-color: #eeeeee;
        }

        .keyboard {
            width: 850px;
            margin: 100px auto;
            padding: 25px;
            background-color: #202729;
            border-radius: 15px;
            box-shadow: 0px 8px 15px grey;
        }

        /* Grid is used for the complete keyboard */
        .row {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 12px;
            margin-bottom: 12px;
        }

        /* Flex is used inside each key */
        .key {
            height: 30px;
            background-color: #30383a;
            color: #00a9d4;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 4px;
            font-weight: bold;
            box-shadow: 0px 3px 5px #111;
        }

        .key:hover {
            background-color: #3d4749;
        }

        /* Wider keys */

        .delete {
            grid-column: span 1;
        }

        .tab {
            grid-column: span 1;
        }

        .enter {
            grid-column: span 2;
        }

        .shift {
            grid-column: span 2;
        }

        .space {
            grid-column: span 5;
        }

        .control {
            grid-column: span 1;
        }

        .option {
            grid-column: span 1;
        }

        .alt {
            grid-column: span 1;
        }

    </style>
</head>

<body>

    <div class="keyboard">

        <!-- Row 1 -->
        <div class="row">
            <div class="key">~</div>
            <div class="key">1</div>
            <div class="key">2</div>
            <div class="key">3</div>
            <div class="key">4</div>
            <div class="key">5</div>
            <div class="key">6</div>
            <div class="key">7</div>
            <div class="key">8</div>
            <div class="key">9</div>
            <div class="key">0</div>
            <div class="key">Delete</div>
        </div>


        <!-- Row 2 -->
        <div class="row">
            <div class="key">Tab</div>
            <div class="key">Q</div>
            <div class="key">W</div>
            <div class="key">E</div>
            <div class="key">R</div>
            <div class="key">T</div>
            <div class="key">Y</div>
            <div class="key">U</div>
            <div class="key">I</div>
            <div class="key">O</div>
            <div class="key">P</div>
            <div class="key">\</div>
        </div>


        <!-- Row 3 -->
        <div class="row">
            <div class="key">Caps</div>
            <div class="key">A</div>
            <div class="key">S</div>
            <div class="key">D</div>
            <div class="key">F</div>
            <div class="key">G</div>
            <div class="key">H</div>
            <div class="key">J</div>
            <div class="key">K</div>
            <div class="key">L</div>
            <div class="key enter">Enter</div>
        </div>


        <!-- Row 4 -->
        <div class="row">
            <div class="key">Shift</div>
            <div class="key">Z</div>
            <div class="key">X</div>
            <div class="key">C</div>
            <div class="key">V</div>
            <div class="key">B</div>
            <div class="key">N</div>
            <div class="key">M</div>
            <div class="key">&lt;</div>
            <div class="key">&gt;</div>
            <div class="key shift">Shift</div>
        </div>


        <!-- Row 5 -->
        <div class="row">
            <div class="key">🌐</div>
            <div class="key control">Control</div>
            <div class="key option">Option</div>
            <div class="key alt">Alt</div>

            <div class="key space">Space</div>

            <div class="key alt">Alt</div>
            <div class="key option">Option</div>
            <div class="key">←</div>
            <div class="key">→</div>
        </div>

    </div>

</body>

</html>
