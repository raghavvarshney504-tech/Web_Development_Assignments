
<!DOCTYPE html>
<html>
<head>
    <title>Grid Layout 4</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: 150px 150px 150px;
            gap: 25px;
            padding: 30px;
        }

        .box {
            background-color: #217c68;
            border-radius: 10px;
        }

        .box1 {
            grid-column: span 1;
        }

        .box2 {
            grid-column: span 2;
        }

        .box3 {
            grid-column: span 1;
        }

        .box4 {
            grid-column: span 2;
        }

        .box5 {
            grid-column: span 1;
        }

        .box6 {
            grid-column: span 1;
        }

        .box7 {
            grid-column: span 1;
        }

        .box8 {
            grid-column: span 1;
        }

        .box9 {
            grid-column: span 2;
        }

    </style>
</head>

<body>

    <div class="container">

        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>

        <div class="box box4"></div>
        <div class="box box5"></div>
        <div class="box box6"></div>

        <div class="box box7"></div>
        <div class="box box8"></div>
        <div class="box box9"></div>

    </div>

</body>
</html>
